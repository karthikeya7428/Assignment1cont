```html
<!DOCTYPE html>
<html>
<head>
    <title>Images and Hyperlinks</title>
</head>

<body>

    <h1>My Webpage</h1>

    <h2>My Favorite Image</h2>

    <img src="https://picsum.photos/400/250" 
         alt="Sample Image" 
         width="400" 
         height="250">

    <h2>Useful Websites</h2>

    <p>
        Visit the following websites:
    </p>

    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>
    <br><br>

    <a href="https://www.youtube.com" target="_blank">
        Visit YouTube
    </a>
    <br><br>

    <a href="https://www.github.com" target="_blank">
        Visit GitHub
    </a>

    <h2>Image as a Hyperlink</h2>

    <a href="https://www.google.com" target="_blank">
        <img src="https://picsum.photos/200/120" 
             alt="Click to visit Google" 
             width="200">
    </a>

</body>
</html>
```
