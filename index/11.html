```html
<!DOCTYPE html>
<html>
<head>
    <title>Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .internal {
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Webpage</h1>

    <p class="external">
        This paragraph is styled using External CSS.
    </p>

    <p class="internal">
        This paragraph is styled using Internal CSS.
    </p>

    <h2>About HTML and CSS</h2>

    <p class="external">
        HTML is used to create the structure of a webpage,
        while CSS is used to style and design the webpage.
    </p>

</body>
</html>
```
