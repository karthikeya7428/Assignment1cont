```html
<!DOCTYPE html>
<html>
<head>
    <title>Frames and Iframes</title>
</head>

<body>

    <h1>My Iframe Webpage</h1>

    <h2>External Webpage</h2>

    <p>The webpage below is displayed using an iframe:</p>

    <iframe 
        src="https://www.example.com"
        width="600"
        height="300"
        title="Example Website">
    </iframe>

    <h2>Another Iframe</h2>

    <iframe 
        src="https://www.wikipedia.org"
        width="600"
        height="300"
        title="Wikipedia">
    </iframe>

</body>
</html>
```
