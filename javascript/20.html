<!DOCTYPE html>
<html>
<head>
    <title>Date and Math Objects</title>
</head>
<body>

<h2>Date and Math Objects</h2>

<script>
    let today = new Date();

    document.write("Current Date: " + today.toDateString() + "<br>");
    document.write("Current Time: " + today.toLocaleTimeString() + "<br><br>");

    document.write("Square Root of 25: " + Math.sqrt(25) + "<br>");
    document.write("Power: " + Math.pow(2, 3) + "<br>");
    document.write("Random Number: " + Math.random() + "<br>");
    document.write("Round 4.7: " + Math.round(4.7) + "<br>");
    document.write("Maximum: " + Math.max(10, 20, 30) + "<br>");
    document.write("Minimum: " + Math.min(10, 20, 30));
</script>

</body>
</html>
