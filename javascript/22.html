<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>
</head>
<body>

<h2 id="text">Original Text</h2>

<button onclick="changeText()">Change Text</button>

<script>
    function changeText() {
        document.getElementById("text").innerHTML =
            "Text has been changed using JavaScript!";
    }
</script>

</body>
</html>
