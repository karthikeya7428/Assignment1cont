<!DOCTYPE html>
<html>
<head>
    <title>Interactive Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        header {
            background: #174EA6;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #0B5394;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            padding: 40px 20px;
            text-align: center;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #bbb;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            background: #174EA6;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Interactive Webpage</h1>
        <p>HTML + CSS + JavaScript</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <div class="card">
            <h2 id="heading">Welcome!</h2>

            <p id="text">
                Click the button to interact with the webpage.
            </p>

            <button onclick="changeText()">Change Text</button>
            <button onclick="changeColor()">Change Color</button>
            <button onclick="showMessage()">Click Me</button>
        </div>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>This is a simple interactive webpage.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: student@example.com</p>
    </section>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script>
        function changeText() {
            document.getElementById("heading").innerText =
                "JavaScript Changed This!";
        }

        function changeColor() {
            document.body.style.background = "#dff0ff";
        }

        function showMessage() {
            alert("Button clicked successfully!");
        }
    </script>

</body>
</html>
