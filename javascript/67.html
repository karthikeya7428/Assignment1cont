<!DOCTYPE html>
<html>
<head>
    <title>Regular Expressions</title>
</head>
<body>

    <h1>Regular Expression Demo</h1>

    <input type="text" id="text"
        placeholder="Enter text">

    <button onclick="testRegex()">Test</button>

    <p id="result"></p>

    <script>
        function testRegex() {

            let text = document.getElementById("text").value;

            // Check whether the text contains only digits
            let numberPattern = /^[0-9]+$/;

            // Check whether the text contains only letters
            let letterPattern = /^[A-Za-z]+$/;

            if (numberPattern.test(text)) {

                document.getElementById("result").innerText =
                    "The input contains only numbers.";

            } else if (letterPattern.test(text)) {

                document.getElementById("result").innerText =
                    "The input contains only letters.";

            } else {

                document.getElementById("result").innerText =
                    "The input contains letters and/or special characters.";
            }
        }
    </script>

</body>
</html>
