<!DOCTYPE html>
<html>
<head>
    <title>Change Image</title>
</head>
<body>

<h2>Change Image</h2>

<img id="image"
     src="https://picsum.photos/id/237/300/200"
     width="300"
     alt="Image">

<br><br>

<button onclick="changeImage()">Change Image</button>

<script>
    function changeImage() {
        document.getElementById("image").src =
            "https://picsum.photos/id/238/300/200";
    }
</script>

</body>
</html>
