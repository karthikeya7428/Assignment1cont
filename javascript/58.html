<!DOCTYPE html>
<html>
<head>
    <title>Remove Duplicates</title>
</head>
<body>

    <h1>Remove Duplicate Elements</h1>

    <input type="text" id="array"
        placeholder="10,20,10,30,20,40">

    <button onclick="removeDuplicates()">Remove</button>

    <p id="result"></p>

    <script>
        function removeDuplicates() {
            let input = document.getElementById("array").value;

            let arr = input.split(",").map(Number);

            let unique = [...new Set(arr)];

            document.getElementById("result").innerText =
                "Array without duplicates: " + unique.join(", ");
        }
    </script>

</body>
</html>
