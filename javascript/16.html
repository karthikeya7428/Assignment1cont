<!DOCTYPE html>
<html>
<head>
    <title>Arrow Function</title>
</head>
<body>

<h2>Arrow Function</h2>

<script>
    let add = (a, b) => a + b;
    let square = n => n * n;

    document.write("Addition = " + add(10, 20) + "<br>");
    document.write("Square = " + square(5));
</script>

</body>
</html>
