<!DOCTYPE html>
<html>
<head>
    <title>Spread and Rest Operators</title>
</head>
<body>

    <h1>Spread and Rest Operators</h1>

    <p id="output"></p>

    <script>
        let numbers1 = [10, 20, 30];
        let numbers2 = [40, 50, 60];

        let allNumbers = [...numbers1, ...numbers2];

        function add(...numbers) {
            let sum = 0;

            for (let number of numbers) {
                sum += number;
            }

            return sum;
        }

        document.getElementById("output").innerHTML =
            "Spread Result: " + allNumbers.join(", ") +
            "<br><br>" +
            "Rest Result: " + add(10, 20, 30, 40);
    </script>

</body>
</html>
