<!DOCTYPE html>
<html>
<head>
    <title>Array Frequency</title>
</head>
<body>

    <h1>Frequency of Array Elements</h1>

    <input type="text" id="array"
        placeholder="10,20,10,30,20,10">

    <button onclick="findFrequency()">Find Frequency</button>

    <p id="result"></p>

    <script>
        function findFrequency() {
            let arr = document.getElementById("array").value
                .split(",")
                .map(Number);

            let frequency = {};

            for (let element of arr) {
                if (frequency[element]) {
                    frequency[element]++;
                } else {
                    frequency[element] = 1;
                }
            }

            let output = "";

            for (let element in frequency) {
                output += element + " = " +
                    frequency[element] + "<br>";
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>

</body>
</html>
