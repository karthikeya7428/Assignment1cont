<!DOCTYPE html>
<html>
<head>
    <title>Positive Negative or Zero</title>
</head>
<body>

<h2>Check Number</h2>

<script>
    let number = -10;

    if (number > 0) {
        document.write(number + " is Positive");
    } 
    else if (number < 0) {
        document.write(number + " is Negative");
    } 
    else {
        document.write("The number is Zero");
    }
</script>

</body>
</html>
