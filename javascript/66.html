<!DOCTYPE html>
<html>
<head>
    <title>Character Frequency</title>
</head>
<body>

    <h1>Character Frequency</h1>

    <input type="text" id="text"
        placeholder="Enter a string">

    <button onclick="findFrequency()">Find Frequency</button>

    <p id="result"></p>

    <script>
        function findFrequency() {
            let text = document.getElementById("text").value
                .toLowerCase();

            let frequency = {};

            for (let char of text) {

                if (char === " ") {
                    continue;
                }

                if (frequency[char]) {
                    frequency[char]++;
                } else {
                    frequency[char] = 1;
                }
            }

            let output = "";

            for (let char in frequency) {
                output += char + " = " +
                    frequency[char] + "<br>";
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>

</body>
</html>
