```html
<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .todo {
            width: 400px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 70%;
        }

        button {
            padding: 10px;
            background: #174EA6;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            list-style: none;
            background: #eee;
            padding: 10px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        li button {
            background: red;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

<div class="todo">

    <h2>My To-Do List</h2>

    <input type="text" id="task" placeholder="Enter a task">

    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>

</div>

<script>
    function addTask() {

        let task = document.getElementById("task").value;

        if (task == "") {
            alert("Please enter a task.");
            return;
        }

        let li = document.createElement("li");

        li.innerHTML =
            task + '<button onclick="this.parentElement.remove()">Delete</button>';

        document.getElementById("list").appendChild(li);

        document.getElementById("task").value = "";
    }
</script>

</body>
</html>
