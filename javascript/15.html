<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions</title>
</head>
<body>

<h2>JavaScript Functions</h2>

<script>
    function add(a, b) {
        return a + b;
    }

    function multiply(a, b) {
        return a * b;
    }

    let x = 10;
    let y = 5;

    document.write("First Number = " + x + "<br>");
    document.write("Second Number = " + y + "<br><br>");

    document.write("Addition = " + add(x, y) + "<br>");
    document.write("Multiplication = " + multiply(x, y));
</script>

</body>
</html>
