<!DOCTYPE html>
<html>
<head>
    <title>Largest Number</title>
</head>
<body>

<h2>Largest of Three Numbers</h2>

<script>
    let a = 25;
    let b = 40;
    let c = 30;

    let largest;

    if (a >= b && a >= c) {
        largest = a;
    } 
    else if (b >= a && b >= c) {
        largest = b;
    } 
    else {
        largest = c;
    }

    document.write("Numbers: " + a + ", " + b + ", " + c + "<br>");
    document.write("Largest Number = " + largest);
</script>

</body>
</html>
