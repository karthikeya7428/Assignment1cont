<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Universal selector */
        * {
            box-sizing: border-box;
        }

        /* Element selector */
        h1 {
            color: blue;
        }

        /* Class selector */
        .student {
            background: lightblue;
            padding: 10px;
        }

        /* ID selector */
        #special {
            color: red;
        }

        /* Attribute selector */
        input[type="text"] {
            border: 2px solid green;
            padding: 8px;
        }

        /* Grouping selector */
        h2, p {
            font-family: Arial;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Student Details</h2>

    <p class="student">Class selector example</p>

    <p id="special">ID selector example</p>

    <input type="text" placeholder="Enter your name">

    <input type="email" placeholder="Enter your email">

</body>
</html>
