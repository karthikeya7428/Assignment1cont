<!DOCTYPE html>
<html>
<head>
    <title>CSS Animation</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: blue;
            position: relative;

            animation: moveBox 4s infinite alternate;
        }

        @keyframes moveBox {

            0% {
                left: 0;
                transform: rotate(0deg);
            }

            50% {
                left: 300px;
                transform: rotate(180deg);
            }

            100% {
                left: 600px;
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Animation</h1>

    <div class="box"></div>

</body>
</html>
