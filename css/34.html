<!DOCTYPE html>
<html>
<head>
    <title>Opacity and Transparency</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: url("https://picsum.photos/1000/700");
            background-size: cover;
            padding: 40px;
        }

        h1 {
            color: white;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 200px;
            height: 150px;
            padding: 30px;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .full {
            background: rgb(23, 78, 166);
        }

        .transparent {
            background: rgba(23, 78, 166, 0.5);
        }

        .opacity {
            background: #174ea6;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <h1>Opacity and Transparency</h1>

    <div class="container">

        <div class="box full">
            100% Opacity
        </div>

        <div class="box transparent">
            50% Transparent
        </div>

        <div class="box opacity">
            50% Opacity
        </div>

    </div>

</body>
</html>
