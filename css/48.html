<!DOCTYPE html>
<html>
<head>
<title>Two Column Layout</title>
<style>
body{margin:0;font-family:Arial}
.container{display:grid;grid-template-columns:2fr 1fr;gap:20px;padding:30px}
article,aside{padding:25px;background:#f2f5f9;border-radius:10px}
h1,h2{color:#174ea6}
</style>
</head>
<body>
<div class="container">
<article>
<h1>Web Development</h1>
<p>HTML and CSS are used to create modern and responsive websites.</p>
<p>CSS Grid provides an easy way to create two-dimensional layouts.</p>
</article>
<aside>
<h2>Related Topics</h2>
<p>HTML</p>
<p>CSS</p>
<p>JavaScript</p>
</aside>
</div>
</body>
</html>
