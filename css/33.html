<!DOCTYPE html>
<html>
<head>
    <title>Border Radius Shapes</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            color: #174ea6;
            margin: 30px;
        }

        .shapes {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .shape {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            background: #174ea6;
        }

        .square {
            border-radius: 0;
        }

        .rounded {
            border-radius: 20px;
        }

        .circle {
            border-radius: 50%;
        }

        .pill {
            width: 220px;
            border-radius: 100px;
        }

        .custom {
            border-radius: 10px 40px 10px 40px;
        }
    </style>
</head>

<body>

    <h1>Border Radius Shapes</h1>

    <div class="shapes">

        <div class="shape square">
            Square
        </div>

        <div class="shape rounded">
            Rounded
        </div>

        <div class="shape circle">
            Circle
        </div>

        <div class="shape pill">
            Pill
        </div>

        <div class="shape custom">
            Custom
        </div>

    </div>

</body>
</html>
