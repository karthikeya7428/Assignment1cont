<!DOCTYPE html>
<html>
<head>
    <title>Transitions and Transformations</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: lightblue;
            margin: 100px auto;
            text-align: center;
            padding: 20px;

            transition: 0.5s;
        }

        .box:hover {
            transform: scale(1.3) rotate(10deg);
            background-color: orange;
        }
    </style>
</head>

<body>

    <h1>Transitions and Transformations</h1>

    <div class="box">
        Hover Me
    </div>

</body>
</html>
