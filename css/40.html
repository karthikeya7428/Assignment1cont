<!DOCTYPE html>
<html>
<head>
    <title>Q5 - Image Hover</title>
    <style>
        body{text-align:center;font-family:Arial}
        .image{width:400px;margin:50px auto;overflow:hidden}
        img{width:100%;transition:.5s}
        img:hover{transform:scale(1.2);filter:brightness(70%)}
    </style>
</head>
<body>
    <h1>Image Hover Effect</h1>

    <div class="image">
        <img src="https://picsum.photos/500/350" alt="Image">
    </div>
</body>
</html>
