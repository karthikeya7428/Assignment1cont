<!DOCTYPE html>
<html>
<head>
    <title>Q2 - Display Properties</title>
    <style>
        body{font-family:Arial}
        .block{display:block;background:lightblue;padding:10px}
        .inline{display:inline;background:lightgreen;padding:10px}
        .inlineblock{display:inline-block;background:orange;padding:20px;margin:10px}
        .none{display:none}
    </style>
</head>
<body>
    <h1>CSS Display Properties</h1>

    <div class="block">Block Element</div>

    <p>This is <span class="inline">Inline Element</span></p>

    <span class="inlineblock">Inline-Block 1</span>
    <span class="inlineblock">Inline-Block 2</span>

    <p class="none">This element is hidden.</p>
</body>
</html>
