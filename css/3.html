<!DOCTYPE html>
<html>
<head>
    <title>Colors Backgrounds and Borders</title>

    <style>
        body {
            background-color: lightgray;
        }

        h1 {
            color: darkblue;
            background-color: lightblue;
            text-align: center;
        }

        p {
            color: white;
            background-color: green;
            border: 3px solid darkgreen;
            padding: 20px;
        }

        .box {
            background-color: yellow;
            border: 5px dashed red;
            padding: 30px;
        }
    </style>
</head>

<body>

    <h1>CSS Colors, Backgrounds and Borders</h1>

    <p>This paragraph demonstrates colors, background and border.</p>

    <div class="box">
        This is a box with a dashed border.
    </div>

</body>
</html>
