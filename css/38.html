<!DOCTYPE html>
<html>
<head>
    <title>Q3 - Visibility</title>
    <style>
        body{text-align:center;font-family:Arial}
        .box{display:inline-block;padding:30px;margin:10px;background:lightblue}
        .hidden{visibility:hidden}
        .none{display:none}
    </style>
</head>
<body>
    <h1>Visibility and Hiding</h1>

    <div class="box">Visible</div>
    <div class="box hidden">Hidden</div>
    <div class="box none">Display None</div>
    <div class="box">Visible</div>

    <p>visibility:hidden keeps the space, while display:none removes it.</p>
</body>
</html>
