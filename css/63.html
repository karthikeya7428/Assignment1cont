<!DOCTYPE html>
<html>
<head>
    <title>Responsive Grid Layout</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial;
        }

        header, footer {
            background: #174EA6;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 15px;
            padding: 15px;
        }

        aside, main {
            padding: 20px;
            border: 1px solid #ccc;
        }

        aside {
            background: #e8f0fe;
        }

        main {
            background: #f5f5f5;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Responsive Grid Layout</h1>
</header>

<div class="container">
    <aside>
        <h2>Sidebar</h2>
        <p>Home</p>
        <p>About</p>
        <p>Contact</p>
    </aside>

    <main>
        <h2>Main Content</h2>
        <p>This webpage uses CSS Grid and media queries.</p>
        <p>On smaller screens, the sidebar moves above the main content.</p>
    </main>
</div>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>
