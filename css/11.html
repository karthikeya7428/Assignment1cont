<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Elements</title>

    <style>
        h1::before {
            content: "★ ";
        }

        h1::after {
            content: " ★";
        }

        p::first-letter {
            font-size: 40px;
            color: red;
        }

        p::first-line {
            font-weight: bold;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Pseudo Elements</h1>

    <p>
        This paragraph demonstrates first-letter and first-line pseudo-elements.
        CSS pseudo-elements allow us to style specific parts of an element.
    </p>

</body>
</html>
