<!DOCTYPE html>
<html>
<head>
    <title>Box Shadow and Text Shadow</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f5f9;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #174ea6;
            text-shadow: 3px 3px 5px #aaa;
        }

        .card {
            width: 300px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 5px 5px 15px #999;
        }

        .card h2 {
            color: #0b5394;
            text-shadow: 2px 2px 4px #bbb;
        }

        .card p {
            color: #555;
        }
    </style>
</head>

<body>

    <h1>Shadow Effects</h1>

    <div class="card">
        <h2>Student Card</h2>
        <p>This card demonstrates box-shadow.</p>
        <p>The heading demonstrates text-shadow.</p>
    </div>

</body>
</html>
