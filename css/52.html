<!DOCTYPE html>
<html>
<head>
<title>Responsive Footer</title>
<style>
body{margin:0;font-family:Arial;min-height:100vh}
main{text-align:center;padding:100px}
footer{background:#174ea6;color:white;padding:30px;display:flex;justify-content:space-around;flex-wrap:wrap}
footer div{margin:10px}
footer h3{color:#f4b400}
@media(max-width:600px){footer{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<main><h1>My Website</h1><p>Welcome to my responsive website.</p></main>
<footer>
<div><h3>About</h3><p>About our website</p></div>
<div><h3>Links</h3><p>Home | Services | Contact</p></div>
<div><h3>Contact</h3><p>example@gmail.com</p></div>
</footer>
</body>
</html>
