<!DOCTYPE html>
<html>
<head>
<title>Card Layout</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f2f5f9;text-align:center}
h1{color:#174ea6}
.cards{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.card{background:white;width:250px;padding:20px;border-radius:10px;box-shadow:0 4px 10px #bbb}
.card h2{color:#174ea6}
button{background:#174ea6;color:white;border:0;padding:10px 20px;border-radius:5px}
</style>
</head>
<body>
<h1>Student Cards</h1>
<div class="cards">
<div class="card"><h2>Karthikeya</h2><p>Computer Science</p><button>View</button></div>
<div class="card"><h2>Rahul</h2><p>Data Science</p><button>View</button></div>
<div class="card"><h2>Arun</h2><p>Artificial Intelligence</p><button>View</button></div>
</div>
</body>
</html>
