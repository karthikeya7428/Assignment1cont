<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>
body{margin:0;font-family:Arial}
.dashboard{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.sidebar{background:#174ea6;color:white;padding:20px}
.main{padding:25px;background:#f5f5f5}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;padding:30px;text-align:center;box-shadow:0 3px 8px #ccc}
</style>
</head>
<body>
<div class="dashboard">
<div class="sidebar"><h2>Dashboard</h2><p>Home</p><p>Students</p><p>Courses</p><p>Settings</p></div>
<div class="main">
<h1>Dashboard</h1>
<div class="cards">
<div class="card"><h2>120</h2><p>Students</p></div>
<div class="card"><h2>15</h2><p>Courses</p></div>
<div class="card"><h2>8</h2><p>Projects</p></div>
</div>
</div>
</div>
</body>
</html>
