<!DOCTYPE html>
<html>
<head>
    <title>CSS Variables</title>

    <style>
        :root {
            --primary: #174ea6;
            --secondary: #0b5394;
            --accent: #f4b400;
            --text: #333;
            --space: 20px;
        }

        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
            color: var(--text);
        }

        header {
            background: var(--primary);
            color: white;
            padding: var(--space);
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: var(--space);
            border-left: 6px solid var(--accent);
            margin-bottom: var(--space);
        }

        h2 {
            color: var(--secondary);
        }

        button {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: var(--secondary);
        }
    </style>
</head>

<body>

    <header>
        <h1>CSS Variables</h1>
        <p>Using Custom Properties</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Student Information</h2>
            <p>
                CSS variables allow us to store and reuse values
                such as colors, spacing and sizes.
            </p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>Advantages</h2>
            <p>
                Variables make CSS easier to maintain and update.
            </p>
        </div>

    </div>

</body>
</html>
