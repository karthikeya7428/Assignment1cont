<!DOCTYPE html>
<html>
<head>
    <title>Sliding Card Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
            padding: 40px;
        }

        .card {
            width: 300px;
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px #aaa;
            animation: slide 2s ease-in-out;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card h2,
        .card p {
            padding: 0 15px;
        }

        @keyframes slide {
            from {
                transform: translateX(-500px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <h1>Sliding Card Animation</h1>

    <div class="card">
        <img src="https://picsum.photos/300/180" alt="Sample Image">
        <h2>Welcome</h2>
        <p>This card slides into the webpage using CSS animation.</p>
    </div>

</body>
</html>
