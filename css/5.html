<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;

            /* Content */
            background-color: lightblue;

            /* Padding */
            padding: 30px;

            /* Border */
            border: 5px solid blue;

            /* Margin */
            margin: 50px auto;

            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        Content Area
        <br><br>
        Padding → Border → Margin
    </div>

</body>
</html>
