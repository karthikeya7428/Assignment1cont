<!DOCTYPE html>
<html>
<head>
<title>Fixed Sidebar</title>
<style>
body{margin:0;font-family:Arial}
.sidebar{position:fixed;left:0;top:0;width:200px;height:100%;background:#174ea6;color:white;padding:20px}
.main{margin-left:240px;padding:30px}
section{height:400px}
h1{color:#174ea6}
</style>
</head>
<body>
<div class="sidebar">
<h2>Menu</h2>
<p>Home</p><p>About</p><p>Services</p><p>Contact</p>
</div>
<div class="main">
<section><h1>Home</h1><p>Welcome to my webpage.</p></section>
<section><h1>About</h1><p>This is the about section.</p></section>
<section><h1>Services</h1><p>Web design and development.</p></section>
<section><h1>Contact</h1><p>Email: example@gmail.com</p></section>
</div>
</body>
</html>
