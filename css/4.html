<!DOCTYPE html>
<html>
<head>
    <title>Font Properties</title>

    <style>
        h1 {
            font-family: Arial;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
        }

        .text {
            font-family: Georgia;
            font-size: 22px;
            font-style: italic;
            font-weight: bold;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 2;
        }

        .center {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Font Properties</h1>

    <p class="text">
        This paragraph demonstrates different font properties and text formatting.
    </p>

    <p class="center">
        This text is center aligned.
    </p>

</body>
</html>
