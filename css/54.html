<!DOCTYPE html>
<html>
<head>
<title>Contact Form</title>
<style>
body{font-family:Arial;background:#f2f5f9}
form{max-width:500px;margin:50px auto;background:white;padding:30px;border-radius:10px}
h1{text-align:center;color:#174ea6}
input,textarea{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
textarea{height:120px}
button{background:#174ea6;color:white;border:0;padding:12px 25px;border-radius:5px}
</style>
</head>
<body>
<form>
<h1>Contact Us</h1>
<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Your Email" required>
<input type="text" placeholder="Subject">
<textarea placeholder="Your Message"></textarea>
<button>Send Message</button>
</form>
</body>
</html>
