<!DOCTYPE html>
<html>
<head>
    <title>CSS Lists and Tables</title>

    <style>
        ul {
            list-style-type: square;
            background-color: lightblue;
            padding: 25px;
        }

        ol {
            list-style-type: upper-roman;
        }

        table {
            border-collapse: collapse;
            width: 80%;
        }

        th, td {
            border: 2px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: darkblue;
            color: white;
        }

        tr:hover {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h1>CSS Lists</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <ol>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <h1>Student Table</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Karthik</td>
            <td>Computer Science</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>IT</td>
            <td>85</td>
        </tr>
    </table>

</body>
</html>
