<!DOCTYPE html>
<html>
<head>
<title>Sticky Header</title>
<style>
body{margin:0;font-family:Arial}
header{position:sticky;top:0;background:#174ea6;color:white;padding:20px;text-align:center;z-index:10}
section{height:400px;padding:30px}
.one{background:#eaf1fb}.two{background:#f9f3df}.three{background:#e5f5e5}
</style>
</head>
<body>
<header><h2>My Website</h2><p>Sticky Header</p></header>
<section class="one"><h1>Home</h1><p>Scroll down to see the sticky header.</p></section>
<section class="two"><h1>About</h1><p>This is the about section.</p></section>
<section class="three"><h1>Contact</h1><p>This is the contact section.</p></section>
</body>
</html>
