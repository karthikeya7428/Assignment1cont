<!DOCTYPE html>
<html>
<head>
    <title>CSS Gradients</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            color: #174ea6;
        }

        .box {
            width: 80%;
            height: 180px;
            margin: 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 25px;
            font-weight: bold;
            border-radius: 15px;
        }

        .linear {
            background: linear-gradient(to right, #174ea6, #42a5f5);
        }

        .radial {
            background: radial-gradient(circle, #f4b400, #e65100);
        }
    </style>
</head>

<body>

    <h1>CSS Gradients</h1>

    <div class="box linear">
        Linear Gradient
    </div>

    <div class="box radial">
        Radial Gradient
    </div>

</body>
</html>
