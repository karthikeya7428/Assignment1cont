<!DOCTYPE html>
<html>
<head>
    <title>Q8 - CSS Filters</title>
    <style>
        body{text-align:center;font-family:Arial}
        .gallery{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
        img{width:200px;height:150px;object-fit:cover}
        .blur{filter:blur(5px)}
        .gray{filter:grayscale(100%)}
        .bright{filter:brightness(160%)}
        .contrast{filter:contrast(180%)}
    </style>
</head>
<body>
    <h1>CSS Filters</h1>

    <div class="gallery">
        <div><img class="blur" src="https://picsum.photos/300/200?1"><p>Blur</p></div>
        <div><img class="gray" src="https://picsum.photos/300/200?2"><p>Grayscale</p></div>
        <div><img class="bright" src="https://picsum.photos/300/200?3"><p>Brightness</p></div>
        <div><img class="contrast" src="https://picsum.photos/300/200?4"><p>Contrast</p></div>
    </div>
</body>
</html>
