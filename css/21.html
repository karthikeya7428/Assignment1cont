<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            color: #333;
        }

        .profile {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 15px #bbb;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #174ea6;
            margin-bottom: 15px;
        }

        h1 {
            color: #174ea6;
            margin-bottom: 8px;
        }

        h3 {
            color: #555;
            margin-bottom: 20px;
        }

        .info {
            text-align: left;
            line-height: 2;
            margin-top: 15px;
        }

        .info strong {
            color: #174ea6;
        }

        .skills {
            margin-top: 20px;
        }

        .skills span {
            display: inline-block;
            background: #174ea6;
            color: white;
            padding: 7px 12px;
            margin: 4px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="profile">
        <img src="student.jpg" alt="Student Photo">

        <h1>Karthikeya V</h1>
        <h3>B.Tech Computer Science Student</h3>

        <div class="info">
            <p><strong>College:</strong> Sai University</p>
            <p><strong>Department:</strong> Computer Science</p>
            <p><strong>Year:</strong> 2nd Year</p>
            <p><strong>Email:</strong> karthikeya@example.com</p>
            <p><strong>Location:</strong> Chennai, Tamil Nadu</p>
        </div>

        <div class="skills">
            <h3>Skills</h3>
            <span>HTML</span>
            <span>CSS</span>
            <span>C</span>
            <span>Python</span>
        </div>
    </div>

</body>
</html>
