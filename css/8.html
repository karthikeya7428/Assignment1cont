<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>

    <style>
        .image {
            width: 150px;
            height: 150px;
            background-color: lightblue;
            float: left;
            margin-right: 20px;
        }

        .clear {
            clear: both;
            background-color: lightgreen;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Float and Clear</h1>

    <div class="image">Image</div>

    <p>
        This text flows around the floated element.
        The float property allows an element to move to the left or right.
    </p>

    <div class="clear">
        This section uses clear: both.
    </div>

</body>
</html>
