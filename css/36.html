<!DOCTYPE html>
<html>
<head>
    <title>Q1 - Z Index</title>
    <style>
        body{text-align:center;font-family:Arial}
        .box{position:absolute;width:150px;height:150px;padding:20px;color:white}
        .one{background:red;left:100px;top:150px;z-index:1}
        .two{background:green;left:180px;top:200px;z-index:2}
        .three{background:blue;left:260px;top:250px;z-index:3}
    </style>
</head>
<body>
    <h1>Z-Index and Stacking Order</h1>
    <div class="box one">Z-Index 1</div>
    <div class="box two">Z-Index 2</div>
    <div class="box three">Z-Index 3</div>
</body>
</html>
