<!DOCTYPE html>
<html>
<head>
    <title>CSS Calc Function</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        header {
            height: 80px;
            background: #174EA6;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: calc(100% - 40px);
            margin: 20px;
            background: white;
            padding: 20px;
            box-sizing: border-box;
        }

        .box {
            width: calc(50% - 20px);
            padding: 30px;
            background: #e8f0fe;
            margin: 10px;
            display: inline-block;
            box-sizing: border-box;
        }

        @media (max-width: 600px) {
            .box {
                width: calc(100% - 20px);
            }
        }
    </style>
</head>

<body>

<header>
    <h1>CSS calc() Function</h1>
</header>

<div class="container">

    <div class="box">
        <h2>Box 1</h2>
        <p>Width is calculated using calc().</p>
    </div>

    <div class="box">
        <h2>Box 2</h2>
        <p>Resize the browser to see the change.</p>
    </div>

</div>

</body>
</html>
