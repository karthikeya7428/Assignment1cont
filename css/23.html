<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
        }

        h1 {
            text-align: center;
            margin: 30px;
            color: #174ea6;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 12px #ccc;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h2 {
            margin: 15px 0 8px;
            color: #333;
        }

        .card p {
            color: #666;
            margin-bottom: 10px;
        }

        .price {
            color: #174ea6;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0b5394;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="products">

        <div class="card">
            <img src="laptop.jpg" alt="Laptop">
            <h2>Laptop</h2>
            <p>Powerful laptop for students.</p>
            <div class="price">₹55,000</div>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="headphones.jpg" alt="Headphones">
            <h2>Headphones</h2>
            <p>Wireless headphones with clear sound.</p>
            <div class="price">₹2,499</div>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="smartwatch.jpg" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p>Smart watch with fitness tracking.</p>
            <div class="price">₹3,999</div>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
