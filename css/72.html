<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
        }

        header {
            background: #174EA6;
            color: white;
            padding: 30px;
        }

        h1 {
            font-size: 8vw;
        }

        h2 {
            font-size: 5vw;
        }

        p {
            font-size: 2.5vw;
            line-height: 1.6;
        }

        .content {
            padding: 5vw;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 10vw;
            }

            h2 {
                font-size: 7vw;
            }

            p {
                font-size: 4vw;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Responsive Typography</h1>
</header>

<div class="content">
    <h2>Resize the Browser</h2>

    <p>
        The text size changes automatically according to
        the screen width.
    </p>

    <p>
        This makes the webpage easier to read on mobile,
        tablet, and desktop devices.
    </p>
</div>

</body>
</html>
