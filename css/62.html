<!DOCTYPE html>
<html>
<head>
<title>Flexbox Properties</title>
<style>
body{font-family:Arial;text-align:center}
.container{
display:flex;
justify-content:space-around;
align-items:center;
height:300px;
background:#eaf1fb
}
.box{width:100px;padding:30px;background:#174ea6;color:white}
.one{order:3}
.two{order:1}
.three{order:2}
</style>
</head>
<body>
<h1>Flexbox Alignment and Ordering</h1>
<div class="container">
<div class="box one">One</div>
<div class="box two">Two</div>
<div class="box three">Three</div>
</div>
</body>
</html>
