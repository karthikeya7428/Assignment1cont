<!DOCTYPE html>
<html>
<head>
    <title>Width Height and Sizing</title>

    <style>
        .box1 {
            width: 300px;
            height: 150px;
            background-color: lightblue;
        }

        .box2 {
            width: 50%;
            height: 100px;
            background-color: lightgreen;
        }

        .box3 {
            width: 80%;
            min-height: 100px;
            max-width: 600px;
            background-color: lightcoral;
        }

        div {
            margin: 20px;
            padding: 20px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <h1>Width and Height</h1>

    <div class="box1">Fixed Width and Height</div>

    <div class="box2">Percentage Width</div>

    <div class="box3">Minimum and Maximum Width</div>

</body>
</html>
