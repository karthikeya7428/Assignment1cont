
<!DOCTYPE html>
<html>
<head>
    <title>Q7 - Button Animation</title>
    <style>
        body{text-align:center;font-family:Arial;padding:100px}
        button{
            padding:15px 30px;
            background:#174ea6;
            color:white;
            border:0;
            border-radius:30px;
            font-size:18px;
            transition:.4s
        }
        button:hover{
            background:#f4b400;
            color:black;
            transform:scale(1.1);
            box-shadow:0 8px 15px #aaa
        }
    </style>
</head>
<body>
    <h1>CSS Button Hover Animation</h1>
    <button>Hover Me</button>
</body>
</html>
