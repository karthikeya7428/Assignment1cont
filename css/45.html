<!DOCTYPE html>
<html>
<head>
    <title>Q10 - Responsive Gallery</title>
    <style>
        *{box-sizing:border-box}
        body{font-family:Arial;margin:0;background:#f5f5f5}
        h1{text-align:center;color:#174ea6}
        .gallery{
            width:90%;
            margin:auto;
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:15px
        }
        img{
            width:100%;
            height:200px;
            object-fit:cover;
            border-radius:10px;
            transition:.3s
        }
        img:hover{transform:scale(1.05)}

        @media(max-width:900px){
            .gallery{grid-template-columns:repeat(2,1fr)}
        }

        @media(max-width:500px){
            .gallery{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/500/400?10" alt="Image 1">
        <img src="https://picsum.photos/500/400?11" alt="Image 2">
        <img src="https://picsum.photos/500/400?12" alt="Image 3">
        <img src="https://picsum.photos/500/400?13" alt="Image 4">
        <img src="https://picsum.photos/500/400?14" alt="Image 5">
        <img src="https://picsum.photos/500/400?15" alt="Image 6">
        <img src="https://picsum.photos/500/400?16" alt="Image 7">
        <img src="https://picsum.photos/500/400?17" alt="Image 8">
    </div>

</body>
</html>
