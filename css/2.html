<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Element selector */
        h1 {
            color: blue;
        }

        /* Class selector */
        .para {
            color: green;
        }

        /* ID selector */
        #special {
            color: red;
            font-weight: bold;
        }

        /* Group selector */
        h2, h3 {
            color: purple;
        }

        /* Universal selector */
        * {
            font-family: Arial;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Element Selector</h2>

    <p class="para">This uses a class selector.</p>

    <p id="special">This uses an ID selector.</p>

    <h2>Group Selector</h2>
    <h3>This heading is also styled.</h3>

</body>
</html>
