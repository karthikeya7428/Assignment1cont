<!DOCTYPE html>
<html>
<head>
<title>Grid Template Areas</title>
<style>
body{margin:0;font-family:Arial}
.container{
display:grid;
grid-template-areas:
"header header"
"sidebar main"
"footer footer";
grid-template-columns:200px 1fr;
grid-template-rows:80px 1fr 60px;
min-height:100vh
}
header{grid-area:header;background:#174ea6;color:white;padding:20px}
aside{grid-area:sidebar;background:#eaf1fb;padding:20px}
main{grid-area:main;padding:30px}
footer{grid-area:footer;background:#174ea6;color:white;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="container">
<header><h2>My Website</h2></header>
<aside><p>Home</p><p>About</p><p>Services</p></aside>
<main><h1>Welcome</h1><p>This layout uses CSS Grid template areas.</p></main>
<footer>© 2026 My Website</footer>
</div>
</body>
</html>
