<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #174ea6;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/500/400?random=1" alt="Photo 1">
        <img src="https://picsum.photos/500/400?random=2" alt="Photo 2">
        <img src="https://picsum.photos/500/400?random=3" alt="Photo 3">
        <img src="https://picsum.photos/500/400?random=4" alt="Photo 4">
        <img src="https://picsum.photos/500/400?random=5" alt="Photo 5">
        <img src="https://picsum.photos/500/400?random=6" alt="Photo 6">
    </div>

</body>
</html>
