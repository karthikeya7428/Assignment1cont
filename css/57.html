<!DOCTYPE html>
<html>
<head>
<title>Online Shopping</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#174ea6;color:white;padding:20px;text-align:center}
.products{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:30px}
.product{background:white;width:220px;padding:20px;text-align:center;border-radius:10px;box-shadow:0 3px 8px #ccc}
.product img{width:100%;height:150px;object-fit:cover}
.price{color:#174ea6;font-weight:bold;font-size:20px}
button{background:#174ea6;color:white;border:0;padding:10px 20px}
</style>
</head>
<body>
<header><h1>My Online Store</h1></header>
<div class="products">
<div class="product"><img src="https://picsum.photos/300/200?20"><h2>Shoes</h2><p class="price">₹1,999</p><button>Buy Now</button></div>
<div class="product"><img src="https://picsum.photos/300/200?21"><h2>Watch</h2><p class="price">₹2,499</p><button>Buy Now</button></div>
<div class="product"><img src="https://picsum.photos/300/200?22"><h2>Bag</h2><p class="price">₹1,499</p><button>Buy Now</button></div>
</div>
</body>
</html>
